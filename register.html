<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%95%8B%3C/text%3E%3C/svg%3E" />
    <title>إنشاء حساب - حراء للسياحة</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Bootstrap 5 RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" />

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <!-- ============================================================ -->
    <!-- SUPABASE.JS - الملف المركزي -->
    <!-- ============================================================ -->
    <script src="supabase.js"></script>
    <style>
        @view-transition { navigation: auto; }

        /* ================================================================
           DESIGN SYSTEM - مطابق للصفحة الرئيسية
           ================================================================ */
        :root {
            --primary: #0e1c2e;
            --primary-light: #1a2e46;
            --primary-dark: #08131f;
            --accent: #9c7a3c;
            --accent-light: #c9a86a;
            --accent-dark: #755a29;
            --accent-tint: rgba(156, 122, 60, 0.08);
            --success: #1c7a4e;
            --success-bg: #e6f3ec;
            --danger: #ad3f39;
            --danger-bg: #f7e8e6;
            --info: #2d6088;
            --info-bg: #e6edf4;
            --warning: #ad7f2e;
            --warning-bg: #f6eee1;
            --bg: #f3f1eb;
            --surface: #ffffff;
            --surface-alt: #faf8f3;
            --border: #e0dccf;
            --border-light: #ebe7db;
            --text: #181712;
            --text-secondary: #5c5648;
            --text-tertiary: #928c79;
            --text-inverse: #f5f3ec;
            --shadow-lg: 0 10px 30px rgba(14,28,46,0.10);
            --shadow-xl: 0 20px 60px rgba(8,19,31,0.35);
            --radius-sm: 4px;
            --radius-md: 6px;
            --radius-lg: 10px;
            --radius-xl: 14px;
            --radius-full: 9999px;
            --t-base: 0.2s ease;
            --font-display: 'Inter', 'Cairo', sans-serif;
            --font-body: 'Cairo', 'Inter', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-body);
            background: radial-gradient(circle at 20% 20%, #16283f 0%, #0e1c2e 55%, #08131f 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        a { text-decoration: none; color: inherit; }
        button { cursor: pointer; font-family: inherit; }

        .register-card {
            background: var(--surface);
            border-radius: var(--radius-xl);
            padding: 40px 40px 30px;
            max-width: 460px;
            width: 100%;
            box-shadow: var(--shadow-xl);
            animation: cardFadeIn 0.5s ease;
            border: 1px solid var(--border);
        }

        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(24px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .register-card .brand { text-align: center; margin-bottom: 24px; }

        .register-card .brand .brand-icon {
            width: 60px; height: 60px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            border-radius: var(--radius-md);
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; color: var(--accent-light);
            margin: 0 auto 12px;
            border: 1px solid var(--accent);
            box-shadow: 0 8px 24px rgba(14,28,46,0.25);
        }

        .register-card .brand h1 {
            font-family: var(--font-display);
            font-size: 21px; font-weight: 800; color: var(--text);
        }
        .register-card .brand h1 span { color: var(--accent-dark); }
        .register-card .brand p { color: var(--text-tertiary); font-size: 12.5px; margin-top: 4px; font-weight: 500; }

        .admin-badge {
            display: inline-block; background: var(--warning-bg); color: var(--warning);
            font-size: 11px; font-weight: 700; padding: 4px 12px; border-radius: var(--radius-full);
            margin-top: 8px;
        }

        .register-card .form-label { font-weight: 600; font-size: 12.5px; color: var(--text-secondary); margin-bottom: 4px; }

        .register-card .form-control {
            border-radius: var(--radius-sm);
            padding: 9px 14px;
            font-family: var(--font-body);
            font-size: 14px;
            border: 1px solid var(--border);
            transition: var(--t-base);
            background: var(--surface);
            color: var(--text);
            height: 42px;
        }

        .register-card .form-control:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(156, 122, 60, 0.1);
            outline: none;
        }

        .password-strength { height: 4px; background: var(--border-light); border-radius: 4px; margin-top: 6px; overflow: hidden; }
        .password-strength .fill { height: 100%; width: 0%; transition: 0.25s; }
        .password-strength-text { font-size: 10.5px; color: var(--text-tertiary); margin-top: 4px; }

        .register-card .error-message, .register-card .success-message, .register-card .info-message {
            padding: 10px 14px; border-radius: var(--radius-sm); font-size: 12.5px;
            display: none; margin-bottom: 14px;
        }
        .register-card .error-message.show, .register-card .success-message.show, .register-card .info-message.show { display: block; }
        .register-card .error-message { background: var(--danger-bg); color: var(--danger); border-right: 3px solid var(--danger); }
        .register-card .success-message { background: var(--success-bg); color: var(--success); border-right: 3px solid var(--success); }
        .register-card .info-message { background: var(--info-bg); color: var(--info); border-right: 3px solid var(--info); }
        .register-card .error-message i, .register-card .success-message i, .register-card .info-message i { margin-left: 6px; }

        .register-card .btn-register {
            width: 100%; padding: 12px; border: none; border-radius: var(--radius-sm);
            background: var(--primary); color: var(--text-inverse);
            font-weight: 700; font-size: 15px; font-family: var(--font-display);
            transition: var(--t-base); cursor: pointer; height: 46px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            margin-top: 6px;
        }
        .register-card .btn-register:hover { background: var(--primary-light); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(14,28,46,0.3); }
        .register-card .btn-register:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
        .register-card .btn-register .spinner-border { width: 18px; height: 18px; border-width: 2px; }

        .register-card .login-link {
            text-align: center; margin-top: 18px; font-size: 13px; color: var(--text-tertiary);
            padding-top: 16px; border-top: 1px solid var(--border-light);
        }
        .register-card .login-link a { color: var(--accent-dark); font-weight: 700; transition: var(--t-base); }
        .register-card .login-link a:hover { color: var(--accent); text-decoration: underline; }

        @media (max-width: 480px) {
            .register-card { padding: 26px 20px 20px; }
            .register-card .brand h1 { font-size: 18px; }
        }
    </style>
</head>
<body>

    <!-- ================================================================ -->
    <!-- REGISTER CARD -->
    <!-- ================================================================ -->
    <div class="register-card">
        <div class="brand">
            <div class="brand-icon">🕋</div>
            <h1>حراء <span>للسياحة</span></h1>
            <p>إنشاء حساب جديد</p>
            <div id="adminBadgeContainer" style="display:none;">
                <span class="admin-badge">👑 المستخدم الأول - سيكون مديراً</span>
            </div>
        </div>

        <div id="infoMessage" class="info-message">
            <i class="bi bi-info-circle-fill"></i>
            <span id="infoText">جاري التحقق من وجود مستخدمين...</span>
        </div>

        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="mb-3">
                <label for="fullName" class="form-label">الاسم الكامل</label>
                <input type="text" class="form-control" id="fullName" placeholder="أدخل اسمك الكامل" required autofocus />
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">البريد الإلكتروني</label>
                <input type="email" class="form-control" id="email" placeholder="أدخل بريدك الإلكتروني" required />
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">كلمة المرور</label>
                <input type="password" class="form-control" id="password" placeholder="أدخل كلمة المرور (6 أحرف)" required minlength="6" oninput="checkPasswordStrength(this.value)" />
                <div class="password-strength"><div class="fill" id="strengthFill"></div></div>
                <div class="password-strength-text" id="strengthText">ضعيفة</div>
            </div>
            <div class="mb-3">
                <label for="companyName" class="form-label">اسم الشركة</label>
                <input type="text" class="form-control" id="companyName" placeholder="اسم الشركة" required />
            </div>

            <div id="errorMessage" class="error-message">
                <i class="bi bi-exclamation-circle-fill"></i>
                <span id="errorText">حدث خطأ</span>
            </div>
            <div id="successMessage" class="success-message">
                <i class="bi bi-check-circle-fill"></i>
                <span>تم إنشاء الحساب بنجاح... جاري التحويل</span>
            </div>

            <button type="submit" class="btn-register" id="registerBtn">
                <span id="registerText">إنشاء حساب</span>
                <span id="registerSpinner" class="spinner-border spinner-border-sm" style="display:none;"></span>
            </button>
        </form>

        <div class="login-link">
            لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a>
        </div>
    </div>

    <!-- ================================================================ -->
    <!-- JAVASCRIPT -->
    <!-- ================================================================ -->
    <script>
        var SUPABASE_URL = SUPABASE_CONFIG.URL;
        var SUPABASE_ANON_KEY = SUPABASE_CONFIG.KEY;
        var isFirstUser = false;

        document.addEventListener('DOMContentLoaded', function() {
            checkIfUsersExist();

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    var form = document.getElementById('registerForm');
                    if (form && document.activeElement &&
                        ['fullName', 'email', 'password', 'companyName'].indexOf(document.activeElement.id) !== -1) {
                        form.dispatchEvent(new Event('submit'));
                    }
                }
            });
        });

        async function checkIfUsersExist() {
            try {
                var response = await fetch(SUPABASE_URL + '/rest/v1/rpc/get_users_count', {
                    method: 'POST',
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
                    body: JSON.stringify({})
                });

                if (!response.ok) throw new Error('HTTP error! status: ' + response.status);

                var count = await response.json();

                if (count === 0) {
                    isFirstUser = true;
                    showAdminBadge();
                } else {
                    isFirstUser = false;
                    hideAdminBadge();
                }
            } catch (error) {
                console.error('❌ خطأ في التحقق من المستخدمين:', error);
                var shouldContinue = confirm(
                    '⚠️ لا يمكن الاتصال بقاعدة البيانات.\nتأكد من:\n1. أن RPC function "get_users_count" موجودة في Supabase\n2. أنك متصل بالإنترنت\n\nهل تريد المتابعة كمستخدم أول؟'
                );
                if (shouldContinue) {
                    isFirstUser = true;
                    showAdminBadge();
                } else {
                    var im = document.getElementById('infoMessage');
                    im.classList.add('show');
                    document.getElementById('infoText').textContent = '⚠️ يرجى إنشاء RPC function "get_users_count" في Supabase SQL Editor أولاً.';
                }
            }
        }

        function showAdminBadge() {
            document.getElementById('adminBadgeContainer').style.display = 'block';
            document.getElementById('infoMessage').classList.add('show');
            document.getElementById('infoText').textContent = '🚀 لا يوجد مستخدمين حالياً. سيتم منحك صلاحية المدير (Admin) عند التسجيل!';
        }

        function hideAdminBadge() {
            document.getElementById('adminBadgeContainer').style.display = 'none';
            document.getElementById('infoMessage').classList.remove('show');
            document.getElementById('infoText').textContent = '✅ يوجد مستخدمين مسجلين بالفعل. سيتم إنشاء حسابك كـ (User) عادي.';
        }

        function checkPasswordStrength(password) {
            var fill = document.getElementById('strengthFill');
            var text = document.getElementById('strengthText');
            var strength = 0;

            if (password.length >= 6) strength++;
            if (password.match(/[a-z]/)) strength++;
            if (password.match(/[A-Z]/)) strength++;
            if (password.match(/[0-9]/)) strength++;
            if (password.match(/[^a-zA-Z0-9]/)) strength++;

            var percentage = (strength / 5) * 100;
            fill.style.width = percentage + '%';

            var colors = ['#ad3f39', '#ad7f2e', '#c9a86a', '#1c7a4e', '#1c7a4e'];
            var labels = ['ضعيفة جداً', 'ضعيفة', 'متوسطة', 'قوية', 'قوية جداً'];
            var colorIndex = Math.min(strength, 4);

            fill.style.background = colors[colorIndex];
            text.textContent = labels[colorIndex];
        }

        async function handleRegister(event) {
            event.preventDefault();

            var fullName = document.getElementById('fullName').value.trim();
            var email = document.getElementById('email').value.trim();
            var password = document.getElementById('password').value.trim();
            var companyName = document.getElementById('companyName').value.trim();
            var errorMessage = document.getElementById('errorMessage');
            var errorText = document.getElementById('errorText');
            var successMessage = document.getElementById('successMessage');
            var registerBtn = document.getElementById('registerBtn');
            var registerText = document.getElementById('registerText');
            var registerSpinner = document.getElementById('registerSpinner');

            errorMessage.classList.remove('show');
            successMessage.classList.remove('show');

            if (!fullName || !email || !password || !companyName) {
                errorText.textContent = 'الرجاء ملء جميع الحقول';
                errorMessage.classList.add('show');
                return;
            }
            if (password.length < 6) {
                errorText.textContent = 'كلمة المرور يجب أن تكون 6 أحرف على الأقل';
                errorMessage.classList.add('show');
                return;
            }

            registerBtn.disabled = true;
            registerText.textContent = 'جاري إنشاء الحساب...';
            registerSpinner.style.display = 'inline-block';

            try {
                var response = await fetch(SUPABASE_URL + '/auth/v1/signup', {
                    method: 'POST',
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: email, password: password,
                        data: { full_name: fullName, company_name: companyName, role: isFirstUser ? 'admin' : 'user' }
                    })
                });

                var data = await response.json();
                console.log('📩 رد Supabase الكامل على signup:', JSON.stringify(data));

                if (response.status === 429) {
                    throw new Error('⚠️ تم تجاوز معدل الطلبات. يرجى الانتظار دقيقة ثم المحاولة مرة أخرى.');
                }
                if (!response.ok) {
                    var errorMsg = data.error_description || data.message || data.msg || data.error || 'فشل إنشاء الحساب';
                    if (errorMsg.includes('already registered')) {
                        errorMsg = 'هذا البريد الإلكتروني مسجل بالفعل. يرجى استخدام بريد آخر.';
                    }
                    throw new Error(errorMsg);
                }

                var userId = data.id || (data.user && data.user.id);
                var userEmail = data.email || (data.user && data.user.email);
                var accessToken = data.access_token;

                if (!userId || !userEmail) {
                    throw new Error('لم يتم استلام بيانات المستخدم بشكل صحيح');
                }
                if (!accessToken) {
                    throw new Error('تم إنشاء الحساب لكن لم يتم تفعيل الجلسة تلقائيًا. يرجى تسجيل الدخول يدويًا لإكمال الملف الشخصي.');
                }

                var role = isFirstUser ? 'admin' : 'user';
                await addUserToDatabase(userId, fullName, userEmail, role, companyName, accessToken);

                var successMsg = isFirstUser ?
                    '✅ تم إنشاء حساب المدير بنجاح! سيتم تحويلك إلى صفحة تسجيل الدخول.' :
                    '✅ تم إنشاء الحساب بنجاح! سيتم تحويلك إلى صفحة تسجيل الدخول.';

                successMessage.querySelector('span').textContent = successMsg;
                successMessage.classList.add('show');

                setTimeout(function() { window.location.href = 'login.html'; }, 2500);

            } catch (error) {
                console.error('❌ خطأ:', error);
                errorText.textContent = error.message || 'حدث خطأ أثناء إنشاء الحساب';
                errorMessage.classList.add('show');
            }

            registerBtn.disabled = false;
            registerText.textContent = 'إنشاء حساب';
            registerSpinner.style.display = 'none';
        }

        async function addUserToDatabase(userId, fullName, email, role, companyName, accessToken) {
            try {
                var response = await fetch(SUPABASE_URL + '/rest/v1/users', {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + accessToken,
                        'Content-Type': 'application/json', 'Prefer': 'return=representation'
                    },
                    body: JSON.stringify({
                        id: userId, full_name: fullName, email: email, role: role,
                        company_name: companyName, created_at: new Date().toISOString()
                    })
                });

                if (!response.ok) {
                    var errText = await response.text();
                    console.warn('⚠️ فشل إضافة المستخدم إلى جدول users:', errText);
                    throw new Error('فشل إضافة المستخدم إلى قاعدة البيانات');
                }
            } catch (error) {
                console.error('❌ خطأ في إضافة المستخدم:', error);
                throw new Error('فشل إضافة المستخدم إلى قاعدة البيانات: ' + error.message);
            }
        }
    </script>
</body>
</html>
