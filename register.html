<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>إنشاء حساب - حراء للسياحة</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Bootstrap 5 RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" />

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <style>
        /* ================================================================
           DESIGN SYSTEM - مطابق للصفحة الرئيسية
           ================================================================ */
        :root {
            --primary: #1a2332;
            --primary-light: #243044;
            --primary-dark: #111927;
            --accent: #8b7a4b;
            --accent-light: #b8a77d;
            --accent-dark: #6d5f39;
            --accent-tint: rgba(139, 122, 75, 0.06);

            --success: #1e7a55;
            --success-bg: #e8f3ed;
            --danger: #b84a3e;
            --danger-bg: #f5e8e6;
            --info: #3a6b8f;
            --info-bg: #e6edf3;
            --warning: #b8943a;
            --warning-bg: #f5eee6;

            --bg: #f0eee9;
            --surface: #ffffff;
            --surface-alt: #f8f6f1;
            --border: #dcd8cf;
            --border-light: #e8e5dc;
            --text: #1c1913;
            --text-secondary: #5a5448;
            --text-tertiary: #8f897a;
            --text-inverse: #f4f2ed;

            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.07);
            --shadow-lg: 0 8px 30px rgba(0,0,0,0.1);
            --shadow-xl: 0 20px 60px rgba(0,0,0,0.15);

            --radius-sm: 4px;
            --radius-md: 6px;
            --radius-lg: 8px;
            --radius-xl: 12px;
            --radius-full: 9999px;

            --t-base: 0.2s ease;

            --font-display: 'Inter', 'Cairo', sans-serif;
            --font-body: 'Cairo', 'Inter', sans-serif;
        }

        /* ================================================================
           RESET & BASE
           ================================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background: linear-gradient(135deg, #0f172a 0%, #1a2332 50%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        a {
            text-decoration: none;
            color: inherit;
        }
        button {
            cursor: pointer;
            font-family: inherit;
        }

        /* ================================================================
           REGISTER CARD
           ================================================================ */
        .register-card {
            background: var(--surface);
            border-radius: var(--radius-xl);
            padding: 40px 38px 32px;
            max-width: 480px;
            width: 100%;
            box-shadow: var(--shadow-xl);
            animation: registerFadeIn 0.6s ease;
            border: 1px solid rgba(255,255,255,0.05);
        }

        @keyframes registerFadeIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ===== BRAND ===== */
        .register-card .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .register-card .brand .brand-icon {
            width: 60px;
            height: 60px;
            background: var(--accent);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            color: var(--text-inverse);
            margin: 0 auto 12px;
            box-shadow: 0 8px 24px rgba(139, 122, 75, 0.25);
        }

        .register-card .brand h1 {
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 800;
            color: var(--text);
            margin: 0;
        }

        .register-card .brand h1 span {
            color: var(--accent);
        }

        .register-card .brand p {
            color: var(--text-tertiary);
            font-size: 13px;
            margin-top: 2px;
            font-weight: 500;
        }

        .register-card .brand .admin-badge {
            display: inline-block;
            background: var(--warning-bg);
            color: var(--warning);
            padding: 3px 14px;
            border-radius: var(--radius-full);
            font-size: 11px;
            font-weight: 700;
            margin-top: 6px;
            font-family: var(--font-display);
        }

        /* ===== FORM ===== */
        .register-card .form-label {
            font-weight: 600;
            font-size: 12.5px;
            color: var(--text-secondary);
            margin-bottom: 3px;
        }

        .register-card .form-control {
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            font-family: var(--font-body);
            font-size: 14px;
            border: 1px solid var(--border);
            transition: var(--t-base);
            background: var(--surface);
            color: var(--text);
            height: 44px;
        }

        .register-card .form-control:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(139, 122, 75, 0.08);
            outline: none;
        }

        .register-card .input-group-text {
            background: var(--bg);
            border: 1px solid var(--border);
            border-left: none;
            color: var(--text-tertiary);
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            padding: 0 14px;
            font-size: 14px;
            height: 44px;
        }

        .register-card .input-group .form-control {
            border-left: none;
            border-radius: var(--radius-sm) 0 0 var(--radius-sm);
        }

        .register-card .input-group .form-control:focus {
            border-color: var(--accent);
        }

        .register-card .input-group .form-control:focus+.input-group-text {
            border-color: var(--accent);
        }

        /* ===== PASSWORD STRENGTH ===== */
        .register-card .password-strength {
            height: 4px;
            border-radius: 4px;
            margin-top: 6px;
            background: var(--border);
            overflow: hidden;
            transition: var(--t-base);
        }

        .register-card .password-strength .fill {
            height: 100%;
            border-radius: 4px;
            transition: var(--t-base);
            width: 0%;
        }

        .register-card .password-strength-text {
            font-size: 10.5px;
            color: var(--text-tertiary);
            margin-top: 2px;
        }

        /* ===== BUTTON ===== */
        .register-card .btn-register {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: var(--radius-sm);
            background: var(--accent);
            color: var(--text-inverse);
            font-weight: 700;
            font-size: 15px;
            font-family: var(--font-display);
            transition: var(--t-base);
            cursor: pointer;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 4px;
        }

        .register-card .btn-register:hover {
            background: var(--accent-dark);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(139, 122, 75, 0.3);
        }

        .register-card .btn-register:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .register-card .btn-register .spinner-border {
            width: 18px;
            height: 18px;
            border-width: 2px;
        }

        /* ===== MESSAGES ===== */
        .register-card .error-message {
            background: var(--danger-bg);
            color: var(--danger);
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-size: 12.5px;
            display: none;
            margin-top: 12px;
            border-right: 3px solid var(--danger);
        }

        .register-card .error-message.show {
            display: block;
        }

        .register-card .error-message i {
            margin-left: 6px;
        }

        .register-card .success-message {
            background: var(--success-bg);
            color: var(--success);
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-size: 12.5px;
            display: none;
            margin-top: 12px;
            border-right: 3px solid var(--success);
        }

        .register-card .success-message.show {
            display: block;
        }

        .register-card .success-message i {
            margin-left: 6px;
        }

        .register-card .info-message {
            background: var(--info-bg);
            color: var(--info);
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-size: 12.5px;
            display: none;
            margin-top: 12px;
            border-right: 3px solid var(--info);
        }

        .register-card .info-message.show {
            display: block;
        }

        .register-card .info-message i {
            margin-left: 6px;
        }

        /* ===== LOGIN LINK ===== */
        .register-card .login-link {
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
            color: var(--text-tertiary);
            padding-top: 16px;
            border-top: 1px solid var(--border-light);
        }

        .register-card .login-link a {
            color: var(--accent);
            font-weight: 700;
            transition: var(--t-base);
        }

        .register-card .login-link a:hover {
            color: var(--accent-dark);
            text-decoration: underline;
        }

        /* ================================================================
           RESPONSIVE
           ================================================================ */
        @media (max-width: 480px) {
            .register-card {
                padding: 24px 18px 20px;
            }

            .register-card .brand h1 {
                font-size: 20px;
            }

            .register-card .brand .brand-icon {
                width: 50px;
                height: 50px;
                font-size: 20px;
            }

            .register-card .form-control,
            .register-card .input-group-text,
            .register-card .btn-register {
                height: 42px;
            }

            .register-card .btn-register {
                font-size: 14px;
            }
        }

        /* ================================================================
           DARK MODE
           ================================================================ */
        body.dark-mode .register-card {
            background: var(--primary);
            border-color: rgba(255,255,255,0.05);
        }

        body.dark-mode .register-card .brand h1 {
            color: #e0dcd2;
        }

        body.dark-mode .register-card .brand p {
            color: rgba(232,228,220,0.5);
        }

        body.dark-mode .register-card .form-label {
            color: rgba(232,228,220,0.6);
        }

        body.dark-mode .register-card .form-control {
            background: var(--primary-light);
            color: #e0dcd2;
            border-color: rgba(255,255,255,0.08);
        }

        body.dark-mode .register-card .form-control:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(139, 122, 75, 0.15);
        }

        body.dark-mode .register-card .input-group-text {
            background: var(--primary-light);
            border-color: rgba(255,255,255,0.08);
            color: rgba(232,228,220,0.5);
        }

        body.dark-mode .register-card .error-message {
            background: rgba(184, 74, 62, 0.15);
            color: #dba09a;
            border-right-color: var(--danger);
        }

        body.dark-mode .register-card .success-message {
            background: rgba(30, 122, 85, 0.15);
            color: #7bc4a0;
            border-right-color: var(--success);
        }

        body.dark-mode .register-card .info-message {
            background: rgba(58, 107, 143, 0.15);
            color: #8ab4d4;
            border-right-color: var(--info);
        }

        body.dark-mode .register-card .login-link {
            border-top-color: rgba(255,255,255,0.06);
            color: rgba(232,228,220,0.5);
        }

        body.dark-mode .register-card .login-link a {
            color: var(--accent-light);
        }

        body.dark-mode .register-card .login-link a:hover {
            color: var(--accent);
        }

        body.dark-mode .register-card .btn-register {
            background: var(--accent);
            color: var(--text);
        }

        body.dark-mode .register-card .btn-register:hover {
            background: var(--accent-light);
            color: var(--text);
        }

        body.dark-mode .register-card .brand .admin-badge {
            background: rgba(184, 148, 58, 0.2);
            color: #d4b87a;
        }

        body.dark-mode .register-card .password-strength {
            background: rgba(255,255,255,0.08);
        }

        body.dark-mode .register-card .password-strength-text {
            color: rgba(232,228,220,0.5);
        }
    </style>
</head>
<body>

    <!-- ================================================================ -->
    <!-- REGISTER CARD -->
    <!-- ================================================================ -->
    <div class="register-card">
        <div class="brand">
            <div class="brand-icon">
                <i class="bi bi-person-plus-fill"></i>
            </div>
            <h1>🕋 حراء <span>للسياحة</span></h1>
            <p>إنشاء حساب جديد</p>
            <div id="adminBadgeContainer" style="display:none;">
                <span class="admin-badge">👑 المستخدم الأول - سيكون مديراً</span>
            </div>
        </div>

        <!-- رسالة معلومات -->
        <div id="infoMessage" class="info-message">
            <i class="bi bi-info-circle-fill"></i>
            <span id="infoText">جاري التحقق من وجود مستخدمين...</span>
        </div>

        <!-- نموذج التسجيل -->
        <form id="registerForm" onsubmit="handleRegister(event)">
            <!-- الاسم الكامل -->
            <div class="mb-3">
                <label for="fullName" class="form-label">الاسم الكامل</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                    <input type="text" class="form-control" id="fullName" placeholder="أدخل اسمك الكامل" required autofocus />
                </div>
            </div>

            <!-- البريد الإلكتروني -->
            <div class="mb-3">
                <label for="email" class="form-label">البريد الإلكتروني</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
                    <input type="email" class="form-control" id="email" placeholder="أدخل بريدك الإلكتروني" required />
                </div>
            </div>

            <!-- كلمة المرور -->
            <div class="mb-3">
                <label for="password" class="form-label">كلمة المرور</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" class="form-control" id="password" placeholder="أدخل كلمة المرور (6 أحرف)" required minlength="6" oninput="checkPasswordStrength(this.value)" />
                </div>
                <div class="password-strength">
                    <div class="fill" id="strengthFill"></div>
                </div>
                <div class="password-strength-text" id="strengthText">ضعيفة</div>
            </div>

            <!-- اسم الشركة -->
            <div class="mb-3">
                <label for="companyName" class="form-label">اسم الشركة</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-building-fill"></i></span>
                    <input type="text" class="form-control" id="companyName" placeholder="اسم الشركة" required />
                </div>
            </div>

            <!-- رسائل الخطأ والنجاح -->
            <div id="errorMessage" class="error-message">
                <i class="bi bi-exclamation-circle-fill"></i>
                <span id="errorText">حدث خطأ</span>
            </div>

            <div id="successMessage" class="success-message">
                <i class="bi bi-check-circle-fill"></i>
                <span>تم إنشاء الحساب بنجاح... جاري التحويل</span>
            </div>

            <!-- زر التسجيل -->
            <button type="submit" class="btn-register" id="registerBtn">
                <span id="registerText">إنشاء حساب</span>
                <span id="registerSpinner" class="spinner-border spinner-border-sm" style="display:none;"></span>
            </button>
        </form>

        <!-- رابط تسجيل الدخول -->
        <div class="login-link">
            لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a>
        </div>
    </div>

    <!-- ================================================================ -->
    <!-- JAVASCRIPT -->
    <!-- ================================================================ -->
    <script>
        // ================================================================
        // SUPABASE CONFIGURATION
        // ================================================================
        var SUPABASE_URL = 'https://exalyiwznoadnugtkyne.supabase.co';
        var SUPABASE_ANON_KEY = 'sb_publishable_ySucS0qeduwnGooAgMrPEw_coMeDbno';

        var isFirstUser = false;

        // ================================================================
        // DOM READY
        // ================================================================
        document.addEventListener('DOMContentLoaded', function() {
            // تفعيل الوضع الليلي إذا كان مخزناً
            if (localStorage.getItem('darkMode') === 'true') {
                document.body.classList.add('dark-mode');
            }

            // التحقق من وجود مستخدمين
            checkIfUsersExist();

            // إضافة اختصار Enter
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    var form = document.getElementById('registerForm');
                    if (form && document.activeElement && 
                        (document.activeElement.id === 'fullName' || 
                         document.activeElement.id === 'email' || 
                         document.activeElement.id === 'password' || 
                         document.activeElement.id === 'companyName')) {
                        form.dispatchEvent(new Event('submit'));
                    }
                }
            });
        });

        // ================================================================
        // CHECK IF USERS EXIST (باستخدام RPC الآمن)
        // ================================================================
        async function checkIfUsersExist() {
            try {
                console.log('🔍 جاري التحقق من وجود مستخدمين...');

                // استخدام RPC function بدلاً من القراءة المباشرة
                var response = await fetch(SUPABASE_URL + '/rest/v1/rpc/get_users_count', {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({})
                });

                if (!response.ok) {
                    throw new Error('HTTP error! status: ' + response.status);
                }

                var count = await response.json();
                console.log('📊 عدد المستخدمين (via RPC):', count);

                if (count === 0) {
                    isFirstUser = true;
                    showAdminBadge();
                } else {
                    isFirstUser = false;
                    hideAdminBadge();
                }

            } catch (error) {
                console.error('❌ خطأ في التحقق من المستخدمين:', error);

                // في حالة فشل RPC، نعطي المستخدم خيار المتابعة
                var shouldContinue = confirm(
                    '⚠️ لا يمكن الاتصال بقاعدة البيانات.\n' +
                    'تأكد من:\n' +
                    '1. أن RPC function "get_users_count" موجودة في Supabase\n' +
                    '2. أنك متصل بالإنترنت\n\n' +
                    'هل تريد المتابعة كمستخدم أول؟'
                );

                if (shouldContinue) {
                    isFirstUser = true;
                    showAdminBadge();
                } else {
                    document.getElementById('infoMessage').classList.add('show');
                    document.getElementById('infoText').textContent = '⚠️ يرجى إنشاء RPC function "get_users_count" في Supabase SQL Editor أولاً.';
                }
            }
        }

        // ================================================================
        // SHOW/HIDE ADMIN BADGE
        // ================================================================
        function showAdminBadge() {
            document.getElementById('adminBadgeContainer').style.display = 'block';
            document.getElementById('infoMessage').classList.add('show');
            document.getElementById('infoText').textContent = '🚀 لا يوجد مستخدمين حالياً. سيتم منحك صلاحية المدير (Admin) عند التسجيل!';
        }

        function hideAdminBadge() {
            document.getElementById('adminBadgeContainer').style.display = 'none';
            document.getElementById('infoMessage').classList.remove('show');
            document.getElementById('infoText').textContent = '✅ يوجد مستخدمين مسجلين بالفعل. سيتم إنشاء حسابك كـ (User) عادي.';
        }

        // ================================================================
        // CHECK PASSWORD STRENGTH
        // ================================================================
        function checkPasswordStrength(password) {
            var fill = document.getElementById('strengthFill');
            var text = document.getElementById('strengthText');
            var strength = 0;

            if (password.length >= 6) strength++;
            if (password.match(/[a-z]/)) strength++;
            if (password.match(/[A-Z]/)) strength++;
            if (password.match(/[0-9]/)) strength++;
            if (password.match(/[^a-zA-Z0-9]/)) strength++;

            var percentage = (strength / 5) * 100;
            fill.style.width = percentage + '%';

            var colors = ['#ef4444', '#f59e0b', '#eab308', '#22c55e', '#22c55e'];
            var labels = ['ضعيفة جداً', 'ضعيفة', 'متوسطة', 'قوية', 'قوية جداً'];
            var colorIndex = Math.min(strength, 4);

            fill.style.background = colors[colorIndex];
            text.textContent = labels[colorIndex];
        }

        // ================================================================
        // HANDLE REGISTER
        // ================================================================
        async function handleRegister(event) {
            event.preventDefault();

            var fullName = document.getElementById('fullName').value.trim();
            var email = document.getElementById('email').value.trim();
            var password = document.getElementById('password').value.trim();
            var companyName = document.getElementById('companyName').value.trim();
            var errorMessage = document.getElementById('errorMessage');
            var errorText = document.getElementById('errorText');
            var successMessage = document.getElementById('successMessage');
            var registerBtn = document.getElementById('registerBtn');
            var registerText = document.getElementById('registerText');
            var registerSpinner = document.getElementById('registerSpinner');

            // إخفاء الرسائل السابقة
            errorMessage.classList.remove('show');
            successMessage.classList.remove('show');

            // التحقق من صحة الإدخال
            if (!fullName || !email || !password || !companyName) {
                errorText.textContent = 'الرجاء ملء جميع الحقول';
                errorMessage.classList.add('show');
                return;
            }

            if (password.length < 6) {
                errorText.textContent = 'كلمة المرور يجب أن تكون 6 أحرف على الأقل';
                errorMessage.classList.add('show');
                return;
            }

            // تعطيل الزر أثناء المعالجة
            registerBtn.disabled = true;
            registerText.textContent = 'جاري إنشاء الحساب...';
            registerSpinner.style.display = 'inline-block';

            try {
                console.log('📡 محاولة إنشاء حساب جديد...');

                // 1. إنشاء المستخدم في Supabase Auth
                var response = await fetch(SUPABASE_URL + '/auth/v1/signup', {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password,
                        data: {
                            full_name: fullName,
                            company_name: companyName,
                            role: isFirstUser ? 'admin' : 'user'
                        }
                    })
                });

                var data = await response.json();
                console.log('📨 استجابة Auth:', data);

                if (response.status === 429) {
                    throw new Error('⚠️ تم تجاوز معدل الطلبات. يرجى الانتظار دقيقة ثم المحاولة مرة أخرى.');
                }

                if (!response.ok) {
                    var errorMsg = data.error_description || data.message || 'فشل إنشاء الحساب';
                    if (errorMsg.includes('already registered')) {
                        errorMsg = 'هذا البريد الإلكتروني مسجل بالفعل. يرجى استخدام بريد آخر.';
                    }
                    throw new Error(errorMsg);
                }

                var userId = data.id || (data.user && data.user.id);
                var userEmail = data.email || (data.user && data.user.email);

                if (!userId || !userEmail) {
                    console.error('❌ استجابة غير مكتملة:', data);
                    throw new Error('لم يتم استلام بيانات المستخدم بشكل صحيح');
                }

                console.log('✅ تم إنشاء الحساب في Auth بنجاح:', userEmail);

                // 2. إضافة المستخدم إلى جدول users
                var role = isFirstUser ? 'admin' : 'user';

                await addUserToDatabase(userId, fullName, userEmail, role, companyName);

                // عرض رسالة نجاح
                var successMsg = isFirstUser ?
                    '✅ تم إنشاء حساب المدير بنجاح! سيتم تحويلك إلى صفحة تسجيل الدخول.' :
                    '✅ تم إنشاء الحساب بنجاح! سيتم تحويلك إلى صفحة تسجيل الدخول.';

                successMessage.querySelector('span').textContent = successMsg;
                successMessage.classList.add('show');

                // الانتقال إلى صفحة تسجيل الدخول بعد 2.5 ثانية
                setTimeout(function() {
                    window.location.href = 'login.html';
                }, 2500);

            } catch (error) {
                console.error('❌ خطأ:', error);
                errorText.textContent = error.message || 'حدث خطأ أثناء إنشاء الحساب';
                errorMessage.classList.add('show');
            }

            // إعادة تفعيل الزر
            registerBtn.disabled = false;
            registerText.textContent = 'إنشاء حساب';
            registerSpinner.style.display = 'none';
        }

        // ================================================================
        // ADD USER TO DATABASE
        // ================================================================
        async function addUserToDatabase(userId, fullName, email, role, companyName) {
            try {
                console.log('📝 إضافة المستخدم إلى قاعدة البيانات بالصلاحية:', role);

                var response = await fetch(SUPABASE_URL + '/rest/v1/users', {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=representation'
                    },
                    body: JSON.stringify({
                        id: userId,
                        full_name: fullName,
                        email: email,
                        role: role,
                        company_name: companyName,
                        created_at: new Date().toISOString()
                    })
                });

                if (!response.ok) {
                    var errorText = await response.text();
                    console.warn('⚠️ فشل إضافة المستخدم إلى جدول users:', errorText);
                    throw new Error('فشل إضافة المستخدم إلى قاعدة البيانات');
                }

                console.log('✅ تم إضافة المستخدم إلى قاعدة البيانات بنجاح');

            } catch (error) {
                console.error('❌ خطأ في إضافة المستخدم:', error);
                throw new Error('فشل إضافة المستخدم إلى قاعدة البيانات: ' + error.message);
            }
        }

        // ================================================================
        // CONSOLE WELCOME
        // ================================================================
        console.log('📝 صفحة إنشاء حساب - حراء للسياحة');
        console.log('📡 Supabase URL:', SUPABASE_URL);
        console.log('👑 أول مستخدم يسجل سيكون مديراً (Admin)');
        console.log('✅ استخدام RPC Function لتجاوز RLS');
        console.log('🎨 التصميم متوافق مع الصفحة الرئيسية');
    </script>

</body>
