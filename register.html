<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>إنشاء حساب - حراء للسياحة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="theme.css" />
    <style>
        body {
            background:
                radial-gradient(circle at 15% 15%, rgba(156,122,60,0.16), transparent 40%),
                linear-gradient(135deg, #0e1c2e 0%, #14263b 55%, #1a2e46 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-5);
        }
        .auth-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: var(--space-7) var(--space-6);
            width: 100%;
            max-width: 440px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-light);
            animation: modalPop 0.25s ease;
        }
        .brand-icon {
            width: 60px; height: 60px; border-radius: var(--radius-md);
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            display: flex; align-items: center; justify-content: center;
            font-size: 26px; margin: 0 auto var(--space-4);
            box-shadow: var(--shadow-md);
            color: var(--accent-light);
        }
        .auth-title { font-size: var(--text-xl); font-weight: 800; color: var(--text); letter-spacing: -0.01em; }
        .auth-title .accent { color: var(--accent-dark); }
        .auth-subtitle { font-size: var(--text-sm); color: var(--text-tertiary); margin-top: 4px; }

        .admin-badge {
            display: inline-flex; align-items: center; gap: 6px;
            background: var(--warning-bg); color: var(--accent-dark);
            font-size: var(--text-xs); font-weight: 700; padding: 4px 12px;
            border-radius: var(--radius-full); margin-top: var(--space-3);
            border: 1px solid rgba(156,122,60,0.15);
        }

        .form-note {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-size: var(--text-sm);
            margin-bottom: var(--space-4);
            border: 1px solid transparent;
        }
        .form-note.show { display: flex; }
        .form-note.error { background: var(--danger-bg); color: var(--danger); border-color: rgba(173,63,57,0.15); }
        .form-note.success { background: var(--success-bg); color: var(--success); border-color: rgba(28,122,78,0.15); }
        .form-note.info { background: var(--info-bg); color: var(--info); border-color: rgba(45,96,136,0.15); }

        .password-strength { height: 4px; background: var(--border); border-radius: var(--radius-full); margin-top: 6px; overflow: hidden; }
        .password-strength .fill { height: 100%; width: 0%; transition: 0.25s; border-radius: var(--radius-full); }
        .password-strength-text { font-size: var(--text-xs); color: var(--text-tertiary); margin-top: 4px; }

        .auth-footer-link { font-size: var(--text-sm); color: var(--text-tertiary); }
        .auth-footer-link a { color: var(--accent-dark); font-weight: 600; }
        .auth-footer-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="text-center mb-5">
        <div class="brand-icon"><i class="fas fa-user-plus"></i></div>
        <h1 class="auth-title">حراء <span class="accent">للسياحة</span></h1>
        <p class="auth-subtitle">إنشاء حساب جديد</p>
        <div id="adminBadgeContainer" style="display:none;">
            <span class="admin-badge"><i class="fas fa-shield-halved"></i> أول مستخدم مسجَّل — سيُمنح صلاحية المدير</span>
        </div>
    </div>

    <div id="infoMessage" class="form-note info">
        <i class="fas fa-circle-info"></i>
        <span id="infoText">جاري التحقق من وجود مستخدمين مسجَّلين...</span>
    </div>

    <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4">
        <div class="form-field">
            <label>الاسم الكامل</label>
            <input type="text" id="fullName" placeholder="أدخل اسمك الكامل" required autofocus />
        </div>
        <div class="form-field">
            <label>البريد الإلكتروني</label>
            <input type="email" id="email" placeholder="name@company.com" required />
        </div>
        <div class="form-field">
            <label>كلمة المرور</label>
            <input type="password" id="password" placeholder="6 أحرف على الأقل" required minlength="6" oninput="checkPasswordStrength(this.value)" />
            <div class="password-strength"><div class="fill" id="strengthFill"></div></div>
            <div class="password-strength-text" id="strengthText">قوة كلمة المرور: ضعيفة</div>
        </div>
        <div class="form-field">
            <label>اسم الشركة</label>
            <input type="text" id="companyName" placeholder="اسم الشركة أو المؤسسة" required />
        </div>

        <div id="errorMessage" class="form-note error">
            <i class="fas fa-circle-exclamation"></i>
            <span id="errorText">حدث خطأ أثناء إنشاء الحساب</span>
        </div>
        <div id="successMessage" class="form-note success">
            <i class="fas fa-circle-check"></i>
            <span>تم إنشاء الحساب بنجاح، جاري تحويلك إلى صفحة تسجيل الدخول</span>
        </div>

        <button type="submit" class="btn-primary-solid w-full justify-center py-3" id="registerBtn">
            <span id="registerText">إنشاء حساب</span>
            <i class="fas fa-spinner fa-spin" id="registerSpinner" style="display:none;"></i>
        </button>
    </form>

    <div class="text-center auth-footer-link mt-6">
        لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a>
    </div>
</div>

<script>
var SUPABASE_URL = 'https://exalyiwznoadnugtkyne.supabase.co';
var SUPABASE_ANON_KEY = 'sb_publishable_ySucS0qeduwnGooAgMrPEw_coMeDbno';
var isFirstUser = false;

document.addEventListener('DOMContentLoaded', function() {
    checkIfUsersExist();

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            var form = document.getElementById('registerForm');
            if (form && document.activeElement &&
                ['fullName', 'email', 'password', 'companyName'].indexOf(document.activeElement.id) !== -1) {
                form.dispatchEvent(new Event('submit'));
            }
        }
    });
});

async function checkIfUsersExist() {
    try {
        var response = await fetch(SUPABASE_URL + '/rest/v1/rpc/get_users_count', {
            method: 'POST',
            headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
            body: JSON.stringify({})
        });

        if (!response.ok) throw new Error('HTTP error! status: ' + response.status);

        var count = await response.json();

        if (count === 0) {
            isFirstUser = true;
            showAdminBadge();
        } else {
            isFirstUser = false;
            hideAdminBadge();
        }
    } catch (error) {
        console.error('خطأ في التحقق من المستخدمين:', error);
        var shouldContinue = confirm(
            'تعذّر الاتصال بقاعدة البيانات.\nتأكد من:\n1. وجود دالة RPC باسم "get_users_count" في Supabase\n2. اتصالك بالإنترنت\n\nهل ترغب في المتابعة كأول مستخدم؟'
        );
        if (shouldContinue) {
            isFirstUser = true;
            showAdminBadge();
        } else {
            var im = document.getElementById('infoMessage');
            im.classList.add('show');
            document.getElementById('infoText').textContent = 'يرجى إنشاء دالة RPC باسم "get_users_count" في محرر SQL الخاص بـ Supabase أولاً.';
        }
    }
}

function showAdminBadge() {
    document.getElementById('adminBadgeContainer').style.display = 'block';
    document.getElementById('infoMessage').classList.add('show');
    document.getElementById('infoText').textContent = 'لا يوجد مستخدمون مسجَّلون حالياً. سيُمنح هذا الحساب صلاحية المدير (Admin) فور التسجيل.';
}

function hideAdminBadge() {
    document.getElementById('adminBadgeContainer').style.display = 'none';
    document.getElementById('infoMessage').classList.remove('show');
    document.getElementById('infoText').textContent = 'يوجد مستخدمون مسجَّلون بالفعل. سيُنشأ هذا الحساب بصلاحية مستخدم عادي.';
}

function checkPasswordStrength(password) {
    var fill = document.getElementById('strengthFill');
    var text = document.getElementById('strengthText');
    var strength = 0;

    if (password.length >= 6) strength++;
    if (password.match(/[a-z]/)) strength++;
    if (password.match(/[A-Z]/)) strength++;
    if (password.match(/[0-9]/)) strength++;
    if (password.match(/[^a-zA-Z0-9]/)) strength++;

    var percentage = (strength / 5) * 100;
    fill.style.width = percentage + '%';

    var colors = ['#ad3f39', '#ad7f2e', '#ad7f2e', '#1c7a4e', '#1c7a4e'];
    var labels = ['ضعيفة جداً', 'ضعيفة', 'متوسطة', 'قوية', 'قوية جداً'];
    var colorIndex = Math.min(strength, 4);

    fill.style.background = colors[colorIndex];
    text.textContent = 'قوة كلمة المرور: ' + labels[colorIndex];
}

async function handleRegister(event) {
    event.preventDefault();

    var fullName = document.getElementById('fullName').value.trim();
    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value.trim();
    var companyName = document.getElementById('companyName').value.trim();
    var errorMessage = document.getElementById('errorMessage');
    var errorText = document.getElementById('errorText');
    var successMessage = document.getElementById('successMessage');
    var registerBtn = document.getElementById('registerBtn');
    var registerText = document.getElementById('registerText');
    var registerSpinner = document.getElementById('registerSpinner');

    errorMessage.classList.remove('show');
    successMessage.classList.remove('show');

    if (!fullName || !email || !password || !companyName) {
        errorText.textContent = 'الرجاء تعبئة جميع الحقول';
        errorMessage.classList.add('show');
        return;
    }
    if (password.length < 6) {
        errorText.textContent = 'يجب ألا تقل كلمة المرور عن 6 أحرف';
        errorMessage.classList.add('show');
        return;
    }

    registerBtn.disabled = true;
    registerText.textContent = 'جاري إنشاء الحساب...';
    registerSpinner.style.display = 'inline-block';

    try {
        var response = await fetch(SUPABASE_URL + '/auth/v1/signup', {
            method: 'POST',
            headers: { 'apikey': SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
            body: JSON.stringify({
                email: email, password: password,
                data: { full_name: fullName, company_name: companyName, role: isFirstUser ? 'admin' : 'user' }
            })
        });

        var data = await response.json();

        if (response.status === 429) {
            throw new Error('تم تجاوز الحد المسموح من المحاولات. يرجى الانتظار دقيقة ثم إعادة المحاولة.');
        }
        if (!response.ok) {
            var errorMsg = data.error_description || data.message || 'تعذّر إنشاء الحساب';
            if (errorMsg.includes('already registered')) {
                errorMsg = 'هذا البريد الإلكتروني مسجَّل بالفعل. يرجى استخدام بريد آخر.';
            }
            throw new Error(errorMsg);
        }

        var userId = data.id || (data.user && data.user.id);
        var userEmail = data.email || (data.user && data.user.email);

        if (!userId || !userEmail) {
            throw new Error('تعذّر استلام بيانات المستخدم بشكل صحيح');
        }

        var role = isFirstUser ? 'admin' : 'user';
        await addUserToDatabase(userId, fullName, userEmail, role, companyName);

        var successMsg = isFirstUser ?
            'تم إنشاء حساب المدير بنجاح، سيتم تحويلك إلى صفحة تسجيل الدخول.' :
            'تم إنشاء الحساب بنجاح، سيتم تحويلك إلى صفحة تسجيل الدخول.';

        successMessage.querySelector('span').textContent = successMsg;
        successMessage.classList.add('show');

        setTimeout(function() { window.location.href = 'login.html'; }, 2500);

    } catch (error) {
        console.error('خطأ:', error);
        errorText.textContent = error.message || 'حدث خطأ أثناء إنشاء الحساب';
        errorMessage.classList.add('show');
    }

    registerBtn.disabled = false;
    registerText.textContent = 'إنشاء حساب';
    registerSpinner.style.display = 'none';
}

async function addUserToDatabase(userId, fullName, email, role, companyName) {
    try {
        var response = await fetch(SUPABASE_URL + '/rest/v1/users', {
            method: 'POST',
            headers: {
                'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
                'Content-Type': 'application/json', 'Prefer': 'return=representation'
            },
            body: JSON.stringify({
                id: userId, full_name: fullName, email: email, role: role,
                company_name: companyName, created_at: new Date().toISOString()
            })
        });

        if (!response.ok) {
            var errText = await response.text();
            console.warn('فشل إضافة المستخدم إلى جدول users:', errText);
            throw new Error('فشل إضافة المستخدم إلى قاعدة البيانات');
        }
    } catch (error) {
        console.error('خطأ في إضافة المستخدم:', error);
        throw new Error('فشل إضافة المستخدم إلى قاعدة البيانات: ' + error.message);
    }
}
</script>
</body>
</html>
