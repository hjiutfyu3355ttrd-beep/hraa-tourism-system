<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>إنشاء حساب - حراء للسياحة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="theme.css" />
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 60%, #0d9488 160%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .register-card {
            background: #fff;
            border-radius: 22px;
            padding: 40px 36px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
            animation: modalPop 0.25s ease;
        }
        .brand-icon {
            width: 64px; height: 64px; border-radius: 18px;
            background: linear-gradient(135deg, #0d9488, #14b8a6);
            display: flex; align-items: center; justify-content: center;
            font-size: 30px; margin: 0 auto 16px;
        }
        .error-message, .success-message, .info-message {
            display: none;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 14px;
            align-items: center;
            gap: 8px;
        }
        .error-message.show, .success-message.show, .info-message.show { display: flex; }
        .error-message { background: #fee2e2; color: #991b1b; }
        .success-message { background: #dcfce7; color: #166534; }
        .info-message { background: #e0f2fe; color: #075985; }
        .admin-badge {
            display: inline-block; background: #fef3c7; color: #92400e;
            font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: 20px;
            margin-top: 8px;
        }
        .password-strength { height: 4px; background: #e2e8f0; border-radius: 4px; margin-top: 6px; overflow: hidden; }
        .password-strength .fill { height: 100%; width: 0%; transition: 0.25s; }
        .password-strength-text { font-size: 11px; color: #94a3b8; margin-top: 4px; }
    </style>
</head>
<body>

<div class="register-card">
    <div class="text-center mb-5">
        <div class="brand-icon"><i class="fas fa-user-plus text-white"></i></div>
        <h1 class="text-2xl font-extrabold text-gray-800">🕋 حراء <span class="text-emerald-600">للسياحة</span></h1>
        <p class="text-gray-400 text-sm mt-1">إنشاء حساب جديد</p>
        <div id="adminBadgeContainer" style="display:none;">
            <span class="admin-badge">👑 المستخدم الأول - سيكون مديراً</span>
        </div>
    </div>

    <div id="infoMessage" class="info-message">
        <i class="fas fa-circle-info"></i>
        <span id="infoText">جاري التحقق من وجود مستخدمين...</span>
    </div>

    <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4">
        <div class="form-field">
            <label>الاسم الكامل</label>
            <input type="text" id="fullName" placeholder="أدخل اسمك الكامل" required autofocus />
        </div>
        <div class="form-field">
            <label>البريد الإلكتروني</label>
            <input type="email" id="email" placeholder="أدخل بريدك الإلكتروني" required />
        </div>
        <div class="form-field">
            <label>كلمة المرور</label>
            <input type="password" id="password" placeholder="أدخل كلمة المرور (6 أحرف)" required minlength="6" oninput="checkPasswordStrength(this.value)" />
            <div class="password-strength"><div class="fill" id="strengthFill"></div></div>
            <div class="password-strength-text" id="strengthText">ضعيفة</div>
        </div>
        <div class="form-field">
            <label>اسم الشركة</label>
            <input type="text" id="companyName" placeholder="اسم الشركة" required />
        </div>

        <div id="errorMessage" class="error-message">
            <i class="fas fa-circle-exclamation"></i>
            <span id="errorText">حدث خطأ</span>
        </div>
        <div id="successMessage" class="success-message">
            <i class="fas fa-circle-check"></i>
            <span>تم إنشاء الحساب بنجاح... جاري التحويل</span>
        </div>

        <button type="submit" class="btn-primary-solid w-full justify-center py-3" id="registerBtn">
            <span id="registerText">إنشاء حساب</span>
            <i class="fas fa-spinner fa-spin" id="registerSpinner" style="display:none;"></i>
        </button>
    </form>

    <div class="text-center text-sm text-gray-400 mt-6">
        لديك حساب بالفعل؟ <a href="login.html" class="text-emerald-600 font-semibold hover:underline">تسجيل الدخول</a>
    </div>
</div>

<script>
var SUPABASE_URL = 'https://exalyiwznoadnugtkyne.supabase.co';
var SUPABASE_ANON_KEY = 'sb_publishable_ySucS0qeduwnGooAgMrPEw_coMeDbno';
var isFirstUser = false;

document.addEventListener('DOMContentLoaded', function() {
    checkIfUsersExist();

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            var form = document.getElementById('registerForm');
            if (form && document.activeElement &&
                ['fullName', 'email', 'password', 'companyName'].indexOf(document.activeElement.id) !== -1) {
                form.dispatchEvent(new Event('submit'));
            }
        }
    });
});

async function checkIfUsersExist() {
    try {
        var response = await fetch(SUPABASE_URL + '/rest/v1/rpc/get_users_count', {
            method: 'POST',
            headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
            body: JSON.stringify({})
        });

        if (!response.ok) throw new Error('HTTP error! status: ' + response.status);

        var count = await response.json();

        if (count === 0) {
            isFirstUser = true;
            showAdminBadge();
        } else {
            isFirstUser = false;
            hideAdminBadge();
        }
    } catch (error) {
        console.error('❌ خطأ في التحقق من المستخدمين:', error);
        var shouldContinue = confirm(
            '⚠️ لا يمكن الاتصال بقاعدة البيانات.\nتأكد من:\n1. أن RPC function "get_users_count" موجودة في Supabase\n2. أنك متصل بالإنترنت\n\nهل تريد المتابعة كمستخدم أول؟'
        );
        if (shouldContinue) {
            isFirstUser = true;
            showAdminBadge();
        } else {
            var im = document.getElementById('infoMessage');
            im.classList.add('show');
            document.getElementById('infoText').textContent = '⚠️ يرجى إنشاء RPC function "get_users_count" في Supabase SQL Editor أولاً.';
        }
    }
}

function showAdminBadge() {
    document.getElementById('adminBadgeContainer').style.display = 'block';
    document.getElementById('infoMessage').classList.add('show');
    document.getElementById('infoText').textContent = '🚀 لا يوجد مستخدمين حالياً. سيتم منحك صلاحية المدير (Admin) عند التسجيل!';
}

function hideAdminBadge() {
    document.getElementById('adminBadgeContainer').style.display = 'none';
    document.getElementById('infoMessage').classList.remove('show');
    document.getElementById('infoText').textContent = '✅ يوجد مستخدمين مسجلين بالفعل. سيتم إنشاء حسابك كـ (User) عادي.';
}

function checkPasswordStrength(password) {
    var fill = document.getElementById('strengthFill');
    var text = document.getElementById('strengthText');
    var strength = 0;

    if (password.length >= 6) strength++;
    if (password.match(/[a-z]/)) strength++;
    if (password.match(/[A-Z]/)) strength++;
    if (password.match(/[0-9]/)) strength++;
    if (password.match(/[^a-zA-Z0-9]/)) strength++;

    var percentage = (strength / 5) * 100;
    fill.style.width = percentage + '%';

    var colors = ['#ef4444', '#f59e0b', '#eab308', '#22c55e', '#22c55e'];
    var labels = ['ضعيفة جداً', 'ضعيفة', 'متوسطة', 'قوية', 'قوية جداً'];
    var colorIndex = Math.min(strength, 4);

    fill.style.background = colors[colorIndex];
    text.textContent = labels[colorIndex];
}

async function handleRegister(event) {
    event.preventDefault();

    var fullName = document.getElementById('fullName').value.trim();
    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value.trim();
    var companyName = document.getElementById('companyName').value.trim();
    var errorMessage = document.getElementById('errorMessage');
    var errorText = document.getElementById('errorText');
    var successMessage = document.getElementById('successMessage');
    var registerBtn = document.getElementById('registerBtn');
    var registerText = document.getElementById('registerText');
    var registerSpinner = document.getElementById('registerSpinner');

    errorMessage.classList.remove('show');
    successMessage.classList.remove('show');

    if (!fullName || !email || !password || !companyName) {
        errorText.textContent = 'الرجاء ملء جميع الحقول';
        errorMessage.classList.add('show');
        return;
    }
    if (password.length < 6) {
        errorText.textContent = 'كلمة المرور يجب أن تكون 6 أحرف على الأقل';
        errorMessage.classList.add('show');
        return;
    }

    registerBtn.disabled = true;
    registerText.textContent = 'جاري إنشاء الحساب...';
    registerSpinner.style.display = 'inline-block';

    try {
        var response = await fetch(SUPABASE_URL + '/auth/v1/signup', {
            method: 'POST',
            headers: { 'apikey': SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
            body: JSON.stringify({
                email: email, password: password,
                data: { full_name: fullName, company_name: companyName, role: isFirstUser ? 'admin' : 'user' }
            })
        });

        var data = await response.json();

        if (response.status === 429) {
            throw new Error('⚠️ تم تجاوز معدل الطلبات. يرجى الانتظار دقيقة ثم المحاولة مرة أخرى.');
        }
        if (!response.ok) {
            var errorMsg = data.error_description || data.message || 'فشل إنشاء الحساب';
            if (errorMsg.includes('already registered')) {
                errorMsg = 'هذا البريد الإلكتروني مسجل بالفعل. يرجى استخدام بريد آخر.';
            }
            throw new Error(errorMsg);
        }

        var userId = data.id || (data.user && data.user.id);
        var userEmail = data.email || (data.user && data.user.email);

        if (!userId || !userEmail) {
            throw new Error('لم يتم استلام بيانات المستخدم بشكل صحيح');
        }

        var role = isFirstUser ? 'admin' : 'user';
        await addUserToDatabase(userId, fullName, userEmail, role, companyName);

        var successMsg = isFirstUser ?
            '✅ تم إنشاء حساب المدير بنجاح! سيتم تحويلك إلى صفحة تسجيل الدخول.' :
            '✅ تم إنشاء الحساب بنجاح! سيتم تحويلك إلى صفحة تسجيل الدخول.';

        successMessage.querySelector('span').textContent = successMsg;
        successMessage.classList.add('show');

        setTimeout(function() { window.location.href = 'login.html'; }, 2500);

    } catch (error) {
        console.error('❌ خطأ:', error);
        errorText.textContent = error.message || 'حدث خطأ أثناء إنشاء الحساب';
        errorMessage.classList.add('show');
    }

    registerBtn.disabled = false;
    registerText.textContent = 'إنشاء حساب';
    registerSpinner.style.display = 'none';
}

async function addUserToDatabase(userId, fullName, email, role, companyName) {
    try {
        var response = await fetch(SUPABASE_URL + '/rest/v1/users', {
            method: 'POST',
            headers: {
                'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
                'Content-Type': 'application/json', 'Prefer': 'return=representation'
            },
            body: JSON.stringify({
                id: userId, full_name: fullName, email: email, role: role,
                company_name: companyName, created_at: new Date().toISOString()
            })
        });

        if (!response.ok) {
            var errText = await response.text();
            console.warn('⚠️ فشل إضافة المستخدم إلى جدول users:', errText);
            throw new Error('فشل إضافة المستخدم إلى قاعدة البيانات');
        }
    } catch (error) {
        console.error('❌ خطأ في إضافة المستخدم:', error);
        throw new Error('فشل إضافة المستخدم إلى قاعدة البيانات: ' + error.message);
    }
}
</script>
</body>
</html>
