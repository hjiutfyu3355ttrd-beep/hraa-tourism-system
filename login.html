<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تسجيل الدخول - حراء للسياحة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="theme.css" />
    <style>
        body {
            background:
                radial-gradient(circle at 15% 15%, rgba(156,122,60,0.16), transparent 40%),
                linear-gradient(135deg, #0e1c2e 0%, #14263b 55%, #1a2e46 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-5);
        }
        .auth-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: var(--space-7) var(--space-6);
            width: 100%;
            max-width: 420px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-light);
            animation: modalPop 0.25s ease;
        }
        .brand-icon {
            width: 60px; height: 60px; border-radius: var(--radius-md);
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            display: flex; align-items: center; justify-content: center;
            font-size: 26px; margin: 0 auto var(--space-4);
            box-shadow: var(--shadow-md);
            color: var(--accent-light);
        }
        .auth-title { font-size: var(--text-xl); font-weight: 800; color: var(--text); letter-spacing: -0.01em; }
        .auth-title .accent { color: var(--accent-dark); }
        .auth-subtitle { font-size: var(--text-sm); color: var(--text-tertiary); margin-top: 4px; }

        .form-note {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-size: var(--text-sm);
            margin-bottom: var(--space-4);
            border: 1px solid transparent;
        }
        .form-note.show { display: flex; }
        .form-note.error { background: var(--danger-bg); color: var(--danger); border-color: rgba(173,63,57,0.15); }
        .form-note.success { background: var(--success-bg); color: var(--success); border-color: rgba(28,122,78,0.15); }

        .auth-footer-link { font-size: var(--text-sm); color: var(--text-tertiary); }
        .auth-footer-link a { color: var(--accent-dark); font-weight: 600; }
        .auth-footer-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="text-center mb-6">
        <div class="brand-icon"><i class="fas fa-building-columns"></i></div>
        <h1 class="auth-title">حراء <span class="accent">للسياحة</span></h1>
        <p class="auth-subtitle">النظام المحاسبي المتكامل لإدارة الرحلات</p>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        <div class="form-field">
            <label>البريد الإلكتروني</label>
            <input type="email" id="email" placeholder="name@company.com" required autofocus />
        </div>

        <div class="form-field">
            <label>كلمة المرور</label>
            <input type="password" id="password" placeholder="أدخل كلمة المرور" required />
        </div>

        <div class="flex items-center justify-between text-sm mb-4">
            <label class="flex items-center gap-2" style="color: var(--text-tertiary);">
                <input type="checkbox" id="rememberMe" class="rounded" /> تذكرني
            </label>
            <a href="#" style="color: var(--accent-dark); font-weight: 600;" class="hover:underline">نسيت كلمة المرور؟</a>
        </div>

        <div id="errorMessage" class="form-note error">
            <i class="fas fa-circle-exclamation"></i>
            <span id="errorText">تعذّر التحقق من البريد الإلكتروني أو كلمة المرور</span>
        </div>
        <div id="successMessage" class="form-note success">
            <i class="fas fa-circle-check"></i>
            <span>تم تسجيل الدخول بنجاح، جاري تحويلك إلى لوحة التحكم</span>
        </div>

        <button type="submit" class="btn-primary-solid w-full justify-center py-3" id="loginBtn">
            <span id="loginText">تسجيل الدخول</span>
            <i class="fas fa-spinner fa-spin" id="loginSpinner" style="display:none;"></i>
        </button>
    </form>

    <div class="text-center auth-footer-link mt-6">
        ليس لديك حساب؟ <a href="register.html">إنشاء حساب جديد</a>
    </div>
</div>

<script>
var SUPABASE_URL = 'https://exalyiwznoadnugtkyne.supabase.co';
var SUPABASE_KEY = 'sb_publishable_ySucS0qeduwnGooAgMrPEw_coMeDbno';

document.addEventListener('DOMContentLoaded', function() {
    var session = localStorage.getItem('supabase_session');
    if (session) {
        try {
            var sessionData = JSON.parse(session);
            if (sessionData && sessionData.user) {
                window.location.href = 'index.html';
                return;
            }
        } catch (e) {}
    }

    var remembered = localStorage.getItem('remembered_email');
    if (remembered) {
        document.getElementById('email').value = remembered;
        document.getElementById('rememberMe').checked = true;
    }

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            var form = document.getElementById('loginForm');
            if (form && document.activeElement &&
                (document.activeElement.id === 'email' || document.activeElement.id === 'password')) {
                form.dispatchEvent(new Event('submit'));
            }
        }
    });
});

async function handleLogin(event) {
    event.preventDefault();

    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value.trim();
    var errorMessage = document.getElementById('errorMessage');
    var errorText = document.getElementById('errorText');
    var successMessage = document.getElementById('successMessage');
    var loginBtn = document.getElementById('loginBtn');
    var loginText = document.getElementById('loginText');
    var loginSpinner = document.getElementById('loginSpinner');

    errorMessage.classList.remove('show');
    successMessage.classList.remove('show');

    if (!email || !password) {
        errorText.textContent = 'الرجاء إدخال البريد الإلكتروني وكلمة المرور';
        errorMessage.classList.add('show');
        return;
    }

    loginBtn.disabled = true;
    loginText.textContent = 'جاري تسجيل الدخول...';
    loginSpinner.style.display = 'inline-block';

    try {
        var response = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
            method: 'POST',
            headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email, password: password })
        });

        var data = await response.json();

        if (!response.ok) {
            throw new Error(data.error_description || data.message || 'تعذّر تسجيل الدخول');
        }

        var sessionData = {
            user: data.user,
            access_token: data.access_token,
            refresh_token: data.refresh_token,
            expires_in: data.expires_in,
            expires_at: Math.floor(Date.now() / 1000) + data.expires_in
        };
        localStorage.setItem('supabase_session', JSON.stringify(sessionData));

        if (document.getElementById('rememberMe').checked) {
            localStorage.setItem('remembered_email', email);
        } else {
            localStorage.removeItem('remembered_email');
        }

        successMessage.classList.add('show');
        setTimeout(function() { window.location.href = 'index.html'; }, 1200);

    } catch (error) {
        console.error('خطأ في تسجيل الدخول:', error);
        errorText.textContent = error.message || 'تعذّر تسجيل الدخول. تحقق من البريد الإلكتروني وكلمة المرور';
        errorMessage.classList.add('show');
    }

    loginBtn.disabled = false;
    loginText.textContent = 'تسجيل الدخول';
    loginSpinner.style.display = 'none';
}
</script>
</body>
</html>
