<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تسجيل الدخول - حراء للسياحة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="theme.css" />
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 60%, #0d9488 160%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: #fff;
            border-radius: 22px;
            padding: 40px 36px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
            animation: modalPop 0.25s ease;
        }
        .brand-icon {
            width: 64px; height: 64px; border-radius: 18px;
            background: linear-gradient(135deg, #0d9488, #14b8a6);
            display: flex; align-items: center; justify-content: center;
            font-size: 30px; margin: 0 auto 16px;
        }
        .error-message, .success-message {
            display: none;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 14px;
            align-items: center;
            gap: 8px;
        }
        .error-message.show, .success-message.show { display: flex; }
        .error-message { background: #fee2e2; color: #991b1b; }
        .success-message { background: #dcfce7; color: #166534; }
    </style>
</head>
<body>

<div class="login-card">
    <div class="text-center mb-6">
        <div class="brand-icon"><i class="fas fa-coins text-white"></i></div>
        <h1 class="text-2xl font-extrabold text-gray-800">🕋 حراء <span class="text-emerald-600">للسياحة</span></h1>
        <p class="text-gray-400 text-sm mt-1">النظام المحاسبي المتكامل</p>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        <div class="form-field">
            <label>البريد الإلكتروني</label>
            <input type="email" id="email" placeholder="أدخل بريدك الإلكتروني" required autofocus />
        </div>

        <div class="form-field">
            <label>كلمة المرور</label>
            <input type="password" id="password" placeholder="أدخل كلمة المرور" required />
        </div>

        <div class="flex items-center justify-between text-sm">
            <label class="flex items-center gap-2 text-gray-500">
                <input type="checkbox" id="rememberMe" class="rounded" /> تذكرني
            </label>
            <a href="#" class="text-emerald-600 hover:underline">نسيت كلمة المرور؟</a>
        </div>

        <div id="errorMessage" class="error-message">
            <i class="fas fa-circle-exclamation"></i>
            <span id="errorText">خطأ في البريد الإلكتروني أو كلمة المرور</span>
        </div>
        <div id="successMessage" class="success-message">
            <i class="fas fa-circle-check"></i>
            <span>تم تسجيل الدخول بنجاح... جاري التحويل</span>
        </div>

        <button type="submit" class="btn-primary-solid w-full justify-center py-3" id="loginBtn">
            <span id="loginText">تسجيل الدخول</span>
            <i class="fas fa-spinner fa-spin" id="loginSpinner" style="display:none;"></i>
        </button>
    </form>

    <div class="text-center text-sm text-gray-400 mt-6">
        ليس لديك حساب؟ <a href="register.html" class="text-emerald-600 font-semibold hover:underline">إنشاء حساب جديد</a>
    </div>
</div>

<script>
var SUPABASE_URL = 'https://exalyiwznoadnugtkyne.supabase.co';
var SUPABASE_KEY = 'sb_publishable_ySucS0qeduwnGooAgMrPEw_coMeDbno';

document.addEventListener('DOMContentLoaded', function() {
    var session = localStorage.getItem('supabase_session');
    if (session) {
        try {
            var sessionData = JSON.parse(session);
            if (sessionData && sessionData.user) {
                window.location.href = 'index.html';
                return;
            }
        } catch (e) {}
    }

    var remembered = localStorage.getItem('remembered_email');
    if (remembered) {
        document.getElementById('email').value = remembered;
        document.getElementById('rememberMe').checked = true;
    }

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            var form = document.getElementById('loginForm');
            if (form && document.activeElement &&
                (document.activeElement.id === 'email' || document.activeElement.id === 'password')) {
                form.dispatchEvent(new Event('submit'));
            }
        }
    });
});

async function handleLogin(event) {
    event.preventDefault();

    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value.trim();
    var errorMessage = document.getElementById('errorMessage');
    var errorText = document.getElementById('errorText');
    var successMessage = document.getElementById('successMessage');
    var loginBtn = document.getElementById('loginBtn');
    var loginText = document.getElementById('loginText');
    var loginSpinner = document.getElementById('loginSpinner');

    errorMessage.classList.remove('show');
    successMessage.classList.remove('show');

    if (!email || !password) {
        errorText.textContent = 'الرجاء إدخال البريد الإلكتروني وكلمة المرور';
        errorMessage.classList.add('show');
        return;
    }

    loginBtn.disabled = true;
    loginText.textContent = 'جاري تسجيل الدخول...';
    loginSpinner.style.display = 'inline-block';

    try {
        var response = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
            method: 'POST',
            headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email, password: password })
        });

        var data = await response.json();

        if (!response.ok) {
            throw new Error(data.error_description || data.message || 'فشل تسجيل الدخول');
        }

        var sessionData = {
            user: data.user,
            access_token: data.access_token,
            refresh_token: data.refresh_token,
            expires_in: data.expires_in,
            expires_at: Math.floor(Date.now() / 1000) + data.expires_in
        };
        localStorage.setItem('supabase_session', JSON.stringify(sessionData));

        if (document.getElementById('rememberMe').checked) {
            localStorage.setItem('remembered_email', email);
        } else {
            localStorage.removeItem('remembered_email');
        }

        successMessage.classList.add('show');
        setTimeout(function() { window.location.href = 'index.html'; }, 1200);

    } catch (error) {
        console.error('❌ خطأ في تسجيل الدخول:', error);
        errorText.textContent = error.message || 'فشل تسجيل الدخول. تحقق من البريد الإلكتروني وكلمة المرور';
        errorMessage.classList.add('show');
    }

    loginBtn.disabled = false;
    loginText.textContent = 'تسجيل الدخول';
    loginSpinner.style.display = 'none';
}
</script>
</body>
</html>
