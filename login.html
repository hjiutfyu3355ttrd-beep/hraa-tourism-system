<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%95%8B%3C/text%3E%3C/svg%3E" />
    <title id="pageTitle">تسجيل الدخول - حراء للسياحة</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Bootstrap 5 RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" />

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <!-- ============================================================ -->
    <!-- SUPABASE.JS - الملف المركزي -->
    <!-- ============================================================ -->
    <script src="supabase.js"></script>
    <style>
        @view-transition { navigation: auto; }

        /* ================================================================
           DESIGN SYSTEM - مطابق للصفحة الرئيسية
           ================================================================ */
        :root {
            --primary: #0e1c2e;
            --primary-light: #1a2e46;
            --primary-dark: #08131f;
            --accent: #9c7a3c;
            --accent-light: #c9a86a;
            --accent-dark: #755a29;
            --accent-tint: rgba(156, 122, 60, 0.08);
            --success: #1c7a4e;
            --success-bg: #e6f3ec;
            --danger: #ad3f39;
            --danger-bg: #f7e8e6;
            --info: #2d6088;
            --info-bg: #e6edf4;
            --warning: #ad7f2e;
            --warning-bg: #f6eee1;
            --bg: #f3f1eb;
            --surface: #ffffff;
            --surface-alt: #faf8f3;
            --border: #e0dccf;
            --border-light: #ebe7db;
            --text: #181712;
            --text-secondary: #5c5648;
            --text-tertiary: #928c79;
            --text-inverse: #f5f3ec;
            --shadow-lg: 0 10px 30px rgba(14,28,46,0.10);
            --shadow-xl: 0 20px 60px rgba(8,19,31,0.35);
            --radius-sm: 4px;
            --radius-md: 6px;
            --radius-lg: 10px;
            --radius-xl: 14px;
            --radius-full: 9999px;
            --t-base: 0.2s ease;
            --font-display: 'Inter', 'Cairo', sans-serif;
            --font-body: 'Cairo', 'Inter', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-body);
            background: radial-gradient(circle at 20% 20%, #16283f 0%, #0e1c2e 55%, #08131f 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        a { text-decoration: none; color: inherit; }
        button { cursor: pointer; font-family: inherit; }

        /* ===== LOGIN CARD ===== */
        .login-card {
            background: var(--surface);
            border-radius: var(--radius-xl);
            padding: 44px 40px 36px;
            max-width: 440px;
            width: 100%;
            box-shadow: var(--shadow-xl);
            animation: loginFadeIn 0.5s ease;
            border: 1px solid var(--border);
        }

        @keyframes loginFadeIn {
            from { opacity: 0; transform: translateY(24px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .login-card .brand { text-align: center; margin-bottom: 32px; }

        .login-card .brand .brand-icon {
            width: 64px; height: 64px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            border-radius: var(--radius-md);
            display: flex; align-items: center; justify-content: center;
            font-size: 26px; color: var(--accent-light);
            margin: 0 auto 14px;
            border: 1px solid var(--accent);
            box-shadow: 0 8px 24px rgba(14,28,46,0.25);
        }

        .login-card .brand h1 {
            font-family: var(--font-display);
            font-size: 24px; font-weight: 800; color: var(--text);
        }

        .login-card .brand h1 span { color: var(--accent-dark); }

        .login-card .brand p {
            color: var(--text-tertiary);
            font-size: 13px; margin-top: 4px; font-weight: 500;
        }

        .login-card .form-label {
            font-weight: 600; font-size: 12.5px; color: var(--text-secondary); margin-bottom: 4px;
        }

        .login-card .form-control {
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            font-family: var(--font-body);
            font-size: 14px;
            border: 1px solid var(--border);
            transition: var(--t-base);
            background: var(--surface);
            color: var(--text);
            height: 44px;
        }

        .login-card .form-control:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(156, 122, 60, 0.1);
            outline: none;
        }

        .login-card .input-group-text {
            background: var(--bg);
            border: 1px solid var(--border);
            border-left: none;
            color: var(--text-tertiary);
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            padding: 0 14px;
            font-size: 14px;
            height: 44px;
        }

        .login-card .input-group .form-control {
            border-left: none;
            border-radius: var(--radius-sm) 0 0 var(--radius-sm);
        }

        .login-card .form-check-label { font-size: 12.5px; color: var(--text-tertiary); font-weight: 500; }
        .login-card .form-check-input { border-color: var(--border); cursor: pointer; }
        .login-card .form-check-input:checked { background-color: var(--accent); border-color: var(--accent); }

        .login-card .forgot-link { font-size: 12.5px; color: var(--accent-dark); font-weight: 600; transition: var(--t-base); }
        .login-card .forgot-link:hover { color: var(--accent); text-decoration: underline; }

        .login-card .btn-login {
            width: 100%; padding: 12px; border: none; border-radius: var(--radius-sm);
            background: var(--primary); color: var(--text-inverse);
            font-weight: 700; font-size: 15px; font-family: var(--font-display);
            transition: var(--t-base); cursor: pointer; height: 48px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            margin-top: 4px;
        }

        .login-card .btn-login:hover { background: var(--primary-light); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(14,28,46,0.3); }
        .login-card .btn-login:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
        .login-card .btn-login .spinner-border { width: 18px; height: 18px; border-width: 2px; }

        .login-card .error-message, .login-card .success-message {
            padding: 10px 14px; border-radius: var(--radius-sm); font-size: 12.5px;
            display: none; margin-top: 12px;
        }
        .login-card .error-message.show, .login-card .success-message.show { display: block; }
        .login-card .error-message { background: var(--danger-bg); color: var(--danger); border-right: 3px solid var(--danger); }
        .login-card .success-message { background: var(--success-bg); color: var(--success); border-right: 3px solid var(--success); }
        .login-card .error-message i, .login-card .success-message i { margin-left: 6px; }

        .login-card .register-link {
            text-align: center; margin-top: 18px; font-size: 13px; color: var(--text-tertiary);
            padding-top: 16px; border-top: 1px solid var(--border-light);
        }
        .login-card .register-link a { color: var(--accent-dark); font-weight: 700; transition: var(--t-base); }
        .login-card .register-link a:hover { color: var(--accent); text-decoration: underline; }

        @media (max-width: 480px) {
            .login-card { padding: 28px 20px 24px; }
            .login-card .brand h1 { font-size: 20px; }
            .login-card .brand .brand-icon { width: 52px; height: 52px; font-size: 22px; }
            .login-card .form-control, .login-card .input-group-text, .login-card .btn-login { height: 42px; }
            .login-card .btn-login { font-size: 14px; }
        }
    </style>
</head>
<body>

    <!-- ================================================================ -->
    <!-- LOGIN CARD -->
    <!-- ================================================================ -->
    <div class="login-card">
        <div class="brand">
            <div class="brand-icon">🕋</div>
            <h1 id="brandTitle">حراء <span>للسياحة</span></h1>
            <p>النظام المحاسبي المتكامل</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="mb-3">
                <label for="email" class="form-label">البريد الإلكتروني</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
                    <input type="email" class="form-control" id="email" placeholder="أدخل بريدك الإلكتروني" required autofocus />
                </div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">كلمة المرور</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" class="form-control" id="password" placeholder="أدخل كلمة المرور" required />
                </div>
            </div>

            <div class="mb-3 d-flex justify-content-between align-items-center">
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="rememberMe" />
                    <label class="form-check-label" for="rememberMe">تذكرني</label>
                </div>
                <a href="#" class="forgot-link">نسيت كلمة المرور؟</a>
            </div>

            <div id="errorMessage" class="error-message">
                <i class="bi bi-exclamation-circle-fill"></i>
                <span id="errorText">خطأ في البريد الإلكتروني أو كلمة المرور</span>
            </div>
            <div id="successMessage" class="success-message">
                <i class="bi bi-check-circle-fill"></i>
                <span>تم تسجيل الدخول بنجاح... جاري التحويل</span>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                <span id="loginText">تسجيل الدخول</span>
                <span id="loginSpinner" class="spinner-border spinner-border-sm" style="display:none;"></span>
            </button>
        </form>

        <div class="register-link">
            ليس لديك حساب؟ <a href="register.html">إنشاء حساب جديد</a>
        </div>
    </div>

    <!-- ================================================================ -->
    <!-- JAVASCRIPT -->
    <!-- ================================================================ -->
    <script>
        var SUPABASE_URL = SUPABASE_CONFIG.URL;
        var SUPABASE_KEY = SUPABASE_CONFIG.KEY;

        document.addEventListener('DOMContentLoaded', function() {
            if (Supabase.isLoggedIn()) {
                window.location.href = 'index.html';
                return;
            }

            try {
                var systemName = Supabase.getSystemName();
                if (systemName) {
                    document.title = 'تسجيل الدخول - ' + systemName;
                }
            } catch (e) { /* استخدام الاسم الافتراضي */ }

            var remembered = localStorage.getItem('remembered_email');
            if (remembered) {
                document.getElementById('email').value = remembered;
                document.getElementById('rememberMe').checked = true;
            }

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    var form = document.getElementById('loginForm');
                    if (form && document.activeElement &&
                        (document.activeElement.id === 'email' || document.activeElement.id === 'password')) {
                        form.dispatchEvent(new Event('submit'));
                    }
                }
            });
        });

        async function handleLogin(event) {
            event.preventDefault();

            var email = document.getElementById('email').value.trim();
            var password = document.getElementById('password').value.trim();
            var errorMessage = document.getElementById('errorMessage');
            var errorText = document.getElementById('errorText');
            var successMessage = document.getElementById('successMessage');
            var loginBtn = document.getElementById('loginBtn');
            var loginText = document.getElementById('loginText');
            var loginSpinner = document.getElementById('loginSpinner');

            errorMessage.classList.remove('show');
            successMessage.classList.remove('show');

            if (!email || !password) {
                errorText.textContent = 'الرجاء إدخال البريد الإلكتروني وكلمة المرور';
                errorMessage.classList.add('show');
                return;
            }

            loginBtn.disabled = true;
            loginText.textContent = 'جاري تسجيل الدخول...';
            loginSpinner.style.display = 'inline-block';

            try {
                var response = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
                    method: 'POST',
                    headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, password: password })
                });

                var data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error_description || data.message || 'فشل تسجيل الدخول');
                }

                var sessionData = {
                    user: data.user,
                    access_token: data.access_token,
                    refresh_token: data.refresh_token,
                    expires_in: data.expires_in,
                    expires_at: Math.floor(Date.now() / 1000) + data.expires_in
                };
                localStorage.setItem('supabase_session', JSON.stringify(sessionData));

                if (document.getElementById('rememberMe').checked) {
                    localStorage.setItem('remembered_email', email);
                } else {
                    localStorage.removeItem('remembered_email');
                }

                successMessage.classList.add('show');
                setTimeout(function() { window.location.href = 'index.html'; }, 1200);

            } catch (error) {
                console.error('❌ خطأ في تسجيل الدخول:', error);
                errorText.textContent = error.message || 'فشل تسجيل الدخول. تحقق من البريد الإلكتروني وكلمة المرور';
                errorMessage.classList.add('show');
            }

            loginBtn.disabled = false;
            loginText.textContent = 'تسجيل الدخول';
            loginSpinner.style.display = 'none';
        }
    </script>
</body>
</html>
