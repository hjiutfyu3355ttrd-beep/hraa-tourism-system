<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%95%8B%3C/text%3E%3C/svg%3E" />
    <title>تسجيل الدخول - حراء للسياحة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="theme.css" />
    <script src="supabase.js"></script>
    <style>
        body {
            background: radial-gradient(circle at 20% 20%, #16283f 0%, #0e1c2e 55%, #08131f 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: var(--surface);
            border-radius: 16px;
            padding: 38px 34px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(8,19,31,0.35);
            border: 1px solid var(--border);
            animation: modalPop 0.25s ease;
        }
        .brand-icon {
            width: 56px; height: 56px; border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; margin: 0 auto 14px;
            border: 1px solid var(--accent);
        }
        .error-message, .success-message {
            display: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 12.5px;
            margin-bottom: 14px;
            align-items: center;
            gap: 8px;
        }
        .error-message.show, .success-message.show { display: flex; }
        .error-message { background: var(--danger-bg); color: var(--danger); }
        .success-message { background: var(--success-bg); color: var(--success); }
    </style>
</head>
<body>

<div class="login-card">
    <div class="text-center mb-6">
        <div class="brand-icon"><i class="fas fa-coins" style="color:var(--accent-light);"></i></div>
        <h1 class="page-title-main" style="font-size:19px;">🕋 حراء <span style="color:var(--accent-dark);">للسياحة</span></h1>
        <p class="text-gray-400" style="font-size:11.5px;" >النظام المحاسبي المتكامل</p>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        <div class="form-field">
            <label>البريد الإلكتروني</label>
            <input type="email" id="email" placeholder="أدخل بريدك الإلكتروني" required autofocus />
        </div>

        <div class="form-field">
            <label>كلمة المرور</label>
            <input type="password" id="password" placeholder="أدخل كلمة المرور" required />
        </div>

        <div class="flex items-center justify-between" style="font-size:12.5px;">
            <label class="flex items-center gap-2 text-gray-500">
                <input type="checkbox" id="rememberMe" class="rounded" /> تذكرني
            </label>
            <a href="#" style="color:var(--accent-dark);" class="hover:underline">نسيت كلمة المرور؟</a>
        </div>

        <div id="errorMessage" class="error-message">
            <i class="fas fa-circle-exclamation"></i>
            <span id="errorText">خطأ في البريد الإلكتروني أو كلمة المرور</span>
        </div>
        <div id="successMessage" class="success-message">
            <i class="fas fa-circle-check"></i>
            <span>تم تسجيل الدخول بنجاح... جاري التحويل</span>
        </div>

        <button type="submit" class="btn-primary-solid w-full justify-center py-3" id="loginBtn">
            <span id="loginText">تسجيل الدخول</span>
            <i class="fas fa-spinner fa-spin" id="loginSpinner" style="display:none;"></i>
        </button>
    </form>

    <div class="text-center mt-6" style="font-size:12.5px;color:var(--text-tertiary);">
        ليس لديك حساب؟ <a href="register.html" style="color:var(--accent-dark);" class="font-semibold hover:underline">إنشاء حساب جديد</a>
    </div>
</div>


<script>
var SUPABASE_URL = SUPABASE_CONFIG.URL;
var SUPABASE_KEY = SUPABASE_CONFIG.KEY;

document.addEventListener('DOMContentLoaded', function() {
    var session = localStorage.getItem('supabase_session');
    if (session) {
        try {
            var sessionData = JSON.parse(session);
            if (sessionData && sessionData.user) {
                window.location.href = 'index.html';
                return;
            }
        } catch (e) {}
    }

    var remembered = localStorage.getItem('remembered_email');
    if (remembered) {
        document.getElementById('email').value = remembered;
        document.getElementById('rememberMe').checked = true;
    }

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            var form = document.getElementById('loginForm');
            if (form && document.activeElement &&
                (document.activeElement.id === 'email' || document.activeElement.id === 'password')) {
                form.dispatchEvent(new Event('submit'));
            }
        }
    });
});

async function handleLogin(event) {
    event.preventDefault();

    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value.trim();
    var errorMessage = document.getElementById('errorMessage');
    var errorText = document.getElementById('errorText');
    var successMessage = document.getElementById('successMessage');
    var loginBtn = document.getElementById('loginBtn');
    var loginText = document.getElementById('loginText');
    var loginSpinner = document.getElementById('loginSpinner');

    errorMessage.classList.remove('show');
    successMessage.classList.remove('show');

    if (!email || !password) {
        errorText.textContent = 'الرجاء إدخال البريد الإلكتروني وكلمة المرور';
        errorMessage.classList.add('show');
        return;
    }

    loginBtn.disabled = true;
    loginText.textContent = 'جاري تسجيل الدخول...';
    loginSpinner.style.display = 'inline-block';

    try {
        var response = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
            method: 'POST',
            headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email, password: password })
        });

        var data = await response.json();

        if (!response.ok) {
            throw new Error(data.error_description || data.message || 'فشل تسجيل الدخول');
        }

        var sessionData = {
            user: data.user,
            access_token: data.access_token,
            refresh_token: data.refresh_token,
            expires_in: data.expires_in,
            expires_at: Math.floor(Date.now() / 1000) + data.expires_in
        };
        localStorage.setItem('supabase_session', JSON.stringify(sessionData));

        if (document.getElementById('rememberMe').checked) {
            localStorage.setItem('remembered_email', email);
        } else {
            localStorage.removeItem('remembered_email');
        }

        successMessage.classList.add('show');
        setTimeout(function() { window.location.href = 'index.html'; }, 1200);

    } catch (error) {
        console.error('❌ خطأ في تسجيل الدخول:', error);
        errorText.textContent = error.message || 'فشل تسجيل الدخول. تحقق من البريد الإلكتروني وكلمة المرور';
        errorMessage.classList.add('show');
    }

    loginBtn.disabled = false;
    loginText.textContent = 'تسجيل الدخول';
    loginSpinner.style.display = 'none';
}
</script>
</body>
</html>
